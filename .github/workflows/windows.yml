# Deck for Windows：每次改了 manager/ 或 windows/，在 GitHub 的 Windows 云电脑上自动测一遍。
# Deck for Windows: every change to manager/ or windows/ is tested on a GitHub Windows cloud machine.
# 1) 源码跑自检：后台起得来、系统卡读到真实的 Windows 数据（CPU / 内存 / 磁盘 / 处理器型号）
# 1b) 顶部面板实机测试：真开一个透明置顶窗口，查位置、大小、收起、鼠标碰顶边弹出
# 2) 系统层自检：winport 的进程、磁盘、清理（真的移进回收站再撤销）、工具箱、电脑操控（开记事本读元素、打字、点菜单）
# 3) 界面自查：白天 / 夜里 × 中文 / 英文截图（主页、设置、进程、磁盘、清理、管家、工具箱），Mac 的说法和样子不许漏出来；再拍一套 2 倍清晰的产品图（win-*.png）
# 4) 打包：PyInstaller 打出 Deck.exe，打包后的 exe 再跑一次自检；Inno Setup 做安装包
# 截图和安装包都在这次运行的 Artifacts 里下载。
# 发版：手动运行（Run workflow）并填 release_tag（如 v0.3.0）——全部测试过了才用 .github/releases/<tag>.md 建 Release、挂上安装包。
# Release: run manually with release_tag (e.g. v0.3.0); only after every test passes is the Release created from
# .github/releases/<tag>.md with the installer attached.
name: Windows 版
on:
  pull_request:
    paths: ["manager/**", "windows/**", ".github/workflows/windows.yml"]
  push:
    branches: [main]
    paths: ["manager/**", "windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发版的标签，如 v0.3.0（留空 = 只测试）/ Tag to release, e.g. v0.3.0 (empty = test only)"
        required: false
        default: ""
permissions:
  contents: write   # 只在手动发版时用来建 Release / only used to create the Release on a manual release run
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8   # 测试脚本打中文；云电脑控制台默认 cp1252（Deck 自己在 server.main 里已改成 UTF-8）
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements-build.txt

      - name: 源码自检
        env: { DECK_SELFTEST_OUT: "${{ runner.temp }}\\selftest-src.json" }
        run: |
          python windows/deck_win.py --selftest
          if ($LASTEXITCODE -ne 0) { Get-Content $env:DECK_SELFTEST_OUT; exit 1 }
          Get-Content $env:DECK_SELFTEST_OUT

      - name: 顶部面板实机测试（透明置顶窗口、贴顶边正中、收起藏好、鼠标碰顶边弹出）
        env: { DECK_SELFTEST_OUT: "${{ runner.temp }}\\paneltest.json" }
        run: |
          python windows/deck_win.py --paneltest shots
          $rc = $LASTEXITCODE
          if (Test-Path $env:DECK_SELFTEST_OUT) { Get-Content $env:DECK_SELFTEST_OUT } else { Write-Output "没有生成结果" }
          if ($rc -ne 0) { exit 1 }

      - name: 系统层自检（进程 / 磁盘 / 清理 / 工具箱 / 电脑操控，用真 Windows 的回收站、注册表和桌面）
        run: |
          foreach ($t in "test_diskwatch", "test_cleaner", "test_apptools", "test_hands", "test_voice", "test_keys") {
            Write-Output "== $t"
            python "windows/ci/$t.py"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: 界面自查 + 截图
        if: ${{ !cancelled() }}   # 上面的自检没过也照样截图，一次看到所有问题
        run: |
          npm init -y | Out-Null
          npm install --no-save playwright@1.48.2
          npx playwright install chromium
          # 不开 DECK_STACK_DUMP：定时转储会在别的线程正跑的时候读它的调用栈，偶尔把后台自己弄崩（0xC0000005）。真崩溃 -X faulthandler 照样会写栈
          $p = Start-Process python -ArgumentList "-u","-X","faulthandler","manager/server.py","--no-open" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\deck.log" -RedirectStandardError "$env:RUNNER_TEMP\deck.err"
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { try { Invoke-WebRequest http://127.0.0.1:8777/api/health -UseBasicParsing | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\deck.err"; exit 1 }
          node windows/ci/shots.js shots
          $rc = $LASTEXITCODE
          if ($rc -eq 0) { node windows/ci/promo.js shots; $rc = $LASTEXITCODE }   # 产品图（公开仓库 README 用）
          if ($rc -ne 0) {
            Write-Output "== 后台还在吗：$(-not $p.HasExited)（退出码 $($p.ExitCode)）"
            try { Write-Output "== health：$((Invoke-WebRequest http://127.0.0.1:8777/api/health -UseBasicParsing -TimeoutSec 5).Content)" } catch { Write-Output "== health 失败：$_" }
            Write-Output "== deck.log（最后 80 行）"; Get-Content "$env:RUNNER_TEMP\deck.log" -Tail 80
            Write-Output "== deck.err（最后 120 行）"; Get-Content "$env:RUNNER_TEMP\deck.err" -Tail 400
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($rc -ne 0) { exit $rc }

      - name: 打包 Deck.exe
        run: pyinstaller windows/deck.spec --noconfirm --distpath dist --workpath build

      - name: 打包后的 exe 自检
        run: |
          $out = "$env:RUNNER_TEMP\selftest-exe.json"
          $env:DECK_SELFTEST_OUT = $out
          $p = Start-Process dist\Deck\Deck.exe -ArgumentList "--selftest" -PassThru -Wait
          if (Test-Path $out) { Get-Content $out } else { Write-Output "没有生成自检结果" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 打包后的语音服务自检（Deck.exe --voice：sherpa-onnx / numpy / 语音模块都打进去了、小助手连得上）
        run: |
          $root = "$env:RUNNER_TEMP\voice-root"
          New-Item -ItemType Directory -Force $root | Out-Null
          '{"auto_models": false}' | Out-File -Encoding ascii "$root\config.json"
          $env:DECK_VOICE_ROOT = $root
          $env:DECK_VOICE_AUTO_MODELS = "0"
          $p = Start-Process dist\Deck\Deck.exe -ArgumentList "--voice" -PassThru
          $st = $null
          for ($i = 0; $i -lt 90; $i++) { try { $st = Invoke-RestMethod http://127.0.0.1:8778/status; if ($st.helper) { break } } catch {}; Start-Sleep 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content "$env:LOCALAPPDATA\Deck\logs\voice.log" -Tail 40 -ErrorAction SilentlyContinue
          if (-not $st) { Write-Output "语音服务没起来"; exit 1 }
          $st | ConvertTo-Json -Depth 4
          foreach ($m in "asr", "tts", "stopword", "wake") { if ($st.modules -notcontains $m) { Write-Output "缺模块 $m"; exit 1 } }
          if (-not $st.helper) { Write-Output "小助手没连上"; exit 1 }

      - name: 做安装包
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Get-Content windows/VERSION -Raw).Trim()
          & $iscc "/DAppVersion=$ver" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: deck-windows-screenshots, path: shots, if-no-files-found: ignore }
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with: { name: deck-windows-setup, path: "dist/Deck-Setup-*.exe" }

      - name: 发版：建 Release 并挂上安装包 / Release with installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { Write-Output "标签格式不对：$env:TAG"; exit 1 }
          $ver = (Get-Content windows/VERSION -Raw).Trim()
          if ("v$ver" -ne $env:TAG) { Write-Output "windows/VERSION 是 $ver，和标签 $env:TAG 对不上"; exit 1 }
          $notes = ".github/releases/$env:TAG.md"
          if (-not (Test-Path $notes)) { Write-Output "缺发版说明 $notes"; exit 1 }
          $lines = Get-Content $notes -Encoding utf8
          $title = $lines[0] -replace '^#\s*', ''
          $lines | Select-Object -Skip 1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\notes.md"
          $exe = Get-ChildItem dist\Deck-Setup-*.exe | Select-Object -First 1
          $pre = if ($env:TAG -match '-') { "--prerelease" } else { "--latest" }
          gh release create $env:TAG $exe.FullName --target $env:GITHUB_SHA --title $title --notes-file "$env:RUNNER_TEMP\notes.md" $pre
          if ($LASTEXITCODE -ne 0) { exit 1 }
