<style>
/* 兼容 老 iPad（iOS 15 / Safari 15）：不用容器查询、color-mix、CSS 嵌套、dvh。 */
:root {
  --bg: #0b0d12; --bg2: #11141b; --card: #161a23; --card-hi: #1c212c; --line: rgba(255,255,255,.07);
  --text: #eef0f5; --text2: #a3a9b7; --text3: #707787;
  --ok: #4fd39a; --warn: #f5b546; --err: #ff6b6b; --idle: #6b7280; --accent: #7aa7ff; --accent-fill: #3d68d8;
  --track: rgba(255,255,255,.08); --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.25);
  --sheet: #171b24; --scrim: rgba(0,0,0,.55);
  --r: 18px; --gap: 12px;
  --ease-out: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
}
:root[data-theme="light"] {
  --bg: #eef1f6; --bg2: #e6eaf1; --card: #ffffff; --card-hi: #f6f8fb; --line: rgba(15,23,42,.08);
  --text: #121621; --text2: #4b5363; --text3: #6b7383;
  --ok: #138a5b; --warn: #b26b00; --err: #d23c3c; --idle: #7b8291; --accent: #2f6fe0; --accent-fill: #2f6fe0;
  --track: rgba(15,23,42,.08); --shadow: 0 1px 2px rgba(15,23,42,.06), 0 6px 20px rgba(15,23,42,.06);
  --sheet: #ffffff; --scrim: rgba(15,23,42,.35);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) {
    --bg: #eef1f6; --bg2: #e6eaf1; --card: #ffffff; --card-hi: #f6f8fb; --line: rgba(15,23,42,.08);
    --text: #121621; --text2: #4b5363; --text3: #6b7383;
    --ok: #138a5b; --warn: #b26b00; --err: #d23c3c; --idle: #7b8291; --accent: #2f6fe0; --accent-fill: #2f6fe0;
    --track: rgba(15,23,42,.08); --shadow: 0 1px 2px rgba(15,23,42,.06), 0 6px 20px rgba(15,23,42,.06);
    --sheet: #ffffff; --scrim: rgba(15,23,42,.35);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
  overflow: hidden;
}
body.scroll { overflow: auto; }
/* 中文换行不让最后一两个字单独掉到下一行 */
body { text-wrap: pretty; }
.nobr { white-space: nowrap; }
/* 卡片和弹层里的短句（列表、说明行、小格子）：中文只在空格、标点处换行，不把「文件」「现在」这种词切开；一整段没有断点又放不下时才随便断（11-06） */
.li .t, .sub, .hero small, .tile span, .kv, .fu-c span, .why-i p, .why-i small, .ps, .pr, .note { word-break: keep-all; overflow-wrap: anywhere; }
.li .t.one { flex: 0 1 auto; display: block; white-space: nowrap; text-overflow: ellipsis; -webkit-line-clamp: none; }
.li .lk { flex: none; font-size: 11px; margin-left: -4px; }
.li .t.one ~ .r { margin-left: auto; }
/* 工具箱里的下拉：去掉系统原生样式，换成和皮肤一致的圆角框 + 细箭头 */
.sheet-b select { -webkit-appearance: none; appearance: none; font: inherit; font-size: 13.5px; padding: 0 30px 0 12px !important;
  background-color: var(--glass-hi) !important; border: 1px solid var(--line) !important; border-radius: 10px !important; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--text2) 50%), linear-gradient(135deg, var(--text2) 50%, transparent 50%) !important;
  background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52% !important; background-size: 5px 5px, 5px 5px !important; background-repeat: no-repeat !important; }
.sheet-b select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* 同一个列表里有的行有圆点、有的没有时，没圆点的行往右让一个圆点的位置，左边对齐 */
.list:has(> .li > .dot) > .li:not(:has(> .dot)) { padding-left: 16px; }
/* 外接鼠标时滚动条占位：切到管家页（内容不滚）时滚动条消失会让顶栏右边的按钮跳一下，所以一直留着这条位置 */
body.scroll { scrollbar-gutter: stable; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ---------- 顶栏 ---------- */
header {
  display: flex; align-items: center; gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
  height: calc(64px + env(safe-area-inset-top));
}
.clock { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.clock b { font-size: 30px; font-weight: 650; letter-spacing: -.5px; min-width: 3.1em; }
.clock span { color: var(--text2); font-size: 14px; white-space: nowrap; }
/* 窗口窄的时候顶栏放不下：先收起日期，再收紧页签和时钟（不能让页签压到时钟上） */
@media (max-width: 960px) { .clock span { display: none; } }
@media (max-width: 860px) { html .clock b { font-size: 24px; min-width: 0; } html header .seg.tabs button { padding: 0 12px; } html header { gap: 8px; } }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px;
  background: var(--card); box-shadow: var(--shadow); font-size: 14px; color: var(--text2); white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
/* 带圆点的列表行：圆点、右边的时间对齐第一行文字（文字折成两行时不再对着两行中间） */
.li:has(> .dot) { align-items: flex-start; padding-top: 3px; }
.li:has(> .dot) > .dot { margin-top: 8px; }
.li:has(> .dot) > .r, .li:has(> .dot) > .badge { margin-top: 3px; line-height: 18px; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.error { background: var(--err); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--card); box-shadow: var(--shadow); color: var(--text2); flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 网格 ---------- */
main {
  display: grid; gap: var(--gap);
  padding: 4px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
}
body.fit main { height: calc(var(--vh, 100vh) - 64px - env(safe-area-inset-top)); grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr)); }
body.scroll main { grid-auto-rows: minmax(300px, auto); }

.card {
  position: relative; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px 16px 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; outline: none;
}
.card:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .row-btn:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.card-h { display: flex; align-items: center; gap: 8px; height: 26px; flex: none; }
.ic { width: 20px; height: 20px; color: var(--text2); flex: none; }
.card-h .ic { width: 18px; height: 18px; }
.card-h h2 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 5.5em; }
.card-h .meta { min-width: 0; flex-shrink: 1; }
/* 卡片窄的时候「12 秒前」让位，标题和状态标签留下 */
@container (max-width: 260px) { .card-h .meta .age { display: none; } }
.card-h .meta { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); white-space: nowrap; }
.card-h .meta .age { min-width: 4.6em; text-align: right; }
.state { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.state.ok { color: var(--ok); background: rgba(79,211,154,.12); }
.state.warn { color: var(--warn); background: rgba(245,181,70,.14); }
.state.error { color: var(--err); background: rgba(255,107,107,.14); }
.state.idle { color: var(--text3); background: var(--track); }
.card-b { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 10px; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: thin; margin-right: -8px; padding-right: 8px; }
.card-b > * { flex-shrink: 0; }
/* 滚动内容的边缘渐隐（液态玻璃式过渡）：哪边还有内容被滚出去，哪边才淡出；--fe-t/--fe-b 由 JS 按滚动位置设置，@property 让它平滑过渡 */
@property --fe-t { syntax: "<length>"; inherits: false; initial-value: 0px; }
@property --fe-b { syntax: "<length>"; inherits: false; initial-value: 0px; }
.card-b, .sheet-b, .chat-log {
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe-t), #000 calc(100% - var(--fe-b)), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe-t), #000 calc(100% - var(--fe-b)), transparent 100%);
  transition: --fe-t .28s var(--ease-out), --fe-b .28s var(--ease-out); }
.fe-t { --fe-t: 28px; } .fe-b { --fe-b: 32px; }
/* 弹层里的控件比较高（分段条 44px），顶部渐隐要更长，否则被标题栏切开的那半截看着生硬（11-06） */
.sheet-b.fe-t { --fe-t: 46px; }
/* 命令框能滚动时，底部也渐隐，看得出下面还有 */
.cmd code { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe-t), #000 calc(100% - var(--fe-b)), transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fe-t), #000 calc(100% - var(--fe-b)), transparent 100%); transition: --fe-t .28s var(--ease-out), --fe-b .28s var(--ease-out); }
.cmd code.fe-t { --fe-t: 14px; } .cmd code.fe-b { --fe-b: 22px; }
.card-b::-webkit-scrollbar { width: 6px; } .card-b::-webkit-scrollbar-thumb { background: var(--track); border-radius: 3px; }
.fade { -webkit-mask-image: linear-gradient(#000 calc(100% - 22px), transparent); mask-image: linear-gradient(#000 calc(100% - 22px), transparent); }
.busy-bar { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
.busy-bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1.1s var(--ease-out) infinite; }
.card.busy .busy-bar { opacity: .8; }
@keyframes slide { from { left: -30%; } to { left: 100%; } }

/* 大数字 */
.hero { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; flex: none; }
.hero b { white-space: nowrap; }
.hero b { font-size: 34px; font-weight: 680; letter-spacing: -.8px; line-height: 1.05; }
.hero small { font-size: 13px; color: var(--text2); }
.sub { font-size: 13px; color: var(--text2); }
.foot { font-size: 12.5px; color: var(--text3); line-height: 1.55; flex: none; }
.group.sysbox { padding: 2px 12px; flex: none; }
.spark.short { height: 20px; }
.group.sysbox.tight .li { min-height: 25px; }
.muted { color: var(--text3); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .err-t { color: var(--err); }

/* 用量条 */
.meter { flex: none; }
.meter .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--text2); gap: 8px; }
.meter .top b { color: var(--text); font-size: 15px; font-weight: 640; }
/* 额度行永远一行：左边「5 小时 95% 剩余」不折，右边重置时间放不下才省略（11-07 窄卡里两边各折成两行） */
.meter .top > span:first-child { white-space: nowrap; flex: none; }
.meter .top > span + span { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.u-short { display: none; }
@container (max-width: 300px) { .meter .top { font-size: 12px; gap: 6px; } .meter .top b { font-size: 14px; } .u-full { display: none; } .u-short { display: inline; } }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); width: 0; transition: width .5s var(--ease-out); }
.bar i.warn { background: var(--warn); } .bar i.error { background: var(--err); }

/* 圆环 */
.rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
.ring { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ring svg { width: 100%; max-width: 76px; height: auto; display: block; }
.ring .lab { font-size: 12px; color: var(--text2); }
.ring text { font: 600 17px -apple-system, "SF Pro Text", sans-serif; fill: var(--text); font-variant-numeric: tabular-nums; }
.ring .trk { stroke: var(--track); }
.ring[data-act] { cursor: pointer; border-radius: 12px; outline: none; }
.ring[data-act]:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.ring text.b1 { font-size: 11.5px; font-weight: 650; } .ring text.b2 { font-size: 9.5px; font-weight: 500; fill: var(--text2); }
.ring.turn svg { animation: turn .32s var(--ease-out); }
@keyframes turn { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
.brand { width: 20px; height: 20px; flex: none; } .card-h .brand { width: 18px; height: 18px; } .row-btn .brand { width: 20px; height: 20px; } .ring .val { transition: stroke-dashoffset .6s var(--ease-out); }

/* 小统计格 */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: none; }
.tile { background: var(--card-hi); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.tile b { display: block; font-size: 22px; font-weight: 660; line-height: 1.15; }
.tile span { font-size: 12px; color: var(--text2); white-space: nowrap; }
/* 小方块跟着自己的宽度缩放字号：「待我审查」最多占内容宽度的九成，左右至少留 12px，不会贴到圆角边上 */
/* 选方案 A：统计数字一排，不加框（没有凹槽、分隔线），大数字 + 小字说明，字离哪条边都远 */
.tiles { gap: 10px; }
.tile, html.skin-soft .tile, .sheet .tile { background: none !important; box-shadow: none !important; border-radius: 0 !important; padding: 0 0 4px !important; }
.tile b { font-size: 24px; letter-spacing: -.3px; line-height: 1.1; }
.tile span { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; }
.tile.hl b { color: var(--warn); }

/* 列表 */
.list { display: flex; flex-direction: column; gap: 2px; }
.li { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13.5px; }
/* 列表文字最多两行，第二行才用省略号（11-06：提醒、仓库名、工具箱那行原来一行就被截掉，看不到关键词） */
.li .t { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; line-height: 1.35; padding: 3px 0; }
.li .r { color: var(--text3); font-size: 12px; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 8px; background: rgba(245,181,70,.16); color: var(--warn); white-space: nowrap; }
.empty { font-size: 13px; color: var(--text3); padding: 4px 0; }
.sec { font-size: 12px; color: var(--text3); letter-spacing: .3px; margin-top: 2px; flex: none; }

/* 图表 */
.spark { width: 100%; height: 38px; display: block; flex: none; }
.spark path.l { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.spark path.a { fill: url(#sparkfill); opacity: .35; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 34px; flex: none; }
.bars i { flex: 1; background: var(--accent); opacity: .7; border-radius: 2px 2px 0 0; min-height: 2px; }
.bars i.z { opacity: .18; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--text2); flex: none; }
.kv b { color: var(--text); font-weight: 600; }

/* 页签：监控台 / 管家 / 资讯（管家页、资讯页直接嵌在同一个窗口里） */
.tabs { width: auto; flex: none; }
#butlerFrame, #newsFrame { display: block; border: 0; width: calc(100% - 32px); margin: 4px 16px 16px; height: calc(var(--vh, 100vh) - 64px - 20px - env(safe-area-inset-top)); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
#butlerFrame[hidden], #newsFrame[hidden] { display: none; }
body.on-butler main { display: none; }
/* 管家页不显示状态胶囊，但占位保留，切换时顶栏按钮不跳 */
body.on-butler #overall { visibility: hidden; pointer-events: none; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; background: var(--card-hi); color: var(--text); font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn.primary { background: var(--accent-fill, var(--accent)); color: #fff; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; } /* 外圈留出空隙，实际可点区域仍按 44 计 */
.btn[disabled] { opacity: .45; cursor: default; }
.row-btn { display: flex; align-items: center; gap: 10px; min-height: 44px; width: 100%; text-align: left; border-radius: 12px; padding: 0 12px; }

/* 按压手感：鼠标立刻按下，触屏按住 0.1 秒才下沉（滑动时不乱闪） */
[data-press] { transition: transform .45s var(--spring), opacity .45s var(--spring); }
[data-press].pressed { transform: scale(.97); transition: transform .12s var(--ease-out), opacity .12s var(--ease-out); }
[data-press].pressed.touch { opacity: .8; }
.icon-btn.pressed { transform: scale(.9); }
.card[data-press].pressed { transform: scale(.985); }

/* 错误 / 加载 */
.err-box { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--text2); }
.err-box p { margin: 0; }
.skel { background: var(--track); border-radius: 8px; height: 14px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* 断线横幅 */
.banner {
  position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translate(-50%, -140%);
  background: var(--sheet); box-shadow: 0 10px 30px rgba(0,0,0,.35); border-radius: 16px; padding: 10px 10px 10px 16px;
  display: flex; align-items: center; gap: 12px; z-index: 30; max-width: calc(100% - 32px); transition: transform .3s var(--ease-out);
}
.banner.show { transform: translate(-50%, 0); }
.banner p { margin: 0; font-size: 14px; }
.banner p small { display: block; color: var(--text2); font-size: 12px; }

/* 底部弹层 */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; width: min(680px, 100%); max-height: 86vh; transform: translate(-50%, 104%);
  background: var(--sheet); border-radius: 22px 22px 0 0; z-index: 41; display: flex; flex-direction: column;
  transition: transform .32s var(--ease-out); box-shadow: 0 -10px 40px rgba(0,0,0,.3);

}

.group { background: var(--card-hi); border-radius: 14px; padding: 6px 4px; }

/* 分组标题：直接放在弹层里时靠弹层的 14px 间距、往下收 6px 贴近分组；放在别的盒子里（声音、用量）时自己留 8px，不能再压到分组上 */
.gtitle { font-size: 13px; color: var(--text3); margin: 4px 4px 8px; }

/* 分段控件 */

  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 160%);
  background: #23283a; color: #f3f4f8; border-radius: 14px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 12px;

/* ================= 玻璃风格（用户 11-05 选定 B）=================

  --blob1: rgba(92,124,255,.38); --blob2: rgba(255,140,96,.30); --blob3: rgba(46,190,166,.30); --spot: transparent; /* 浅色模式不要鼠标光晕 */

  background: radial-gradient(32% 38% at 18% 22%, var(--blob1), transparent 70%),

/* ================= 卡片自由摆放：GridStack.js 14.0.0（MIT，static/gridstack-all.js）=================

.rz-br::after { right: 5px; border-right: 2.5px solid var(--accent); border-radius: 0 0 11px 0; }

.chat { position: fixed; z-index: 45; top: calc(64px + env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));

.chat-h .who b { font-size: 16px; }

.chat-h .icon-btn { width: 36px; height: 36px; border-radius: 12px; background: transparent; box-shadow: none; position: relative; }
.chat-h .icon-btn::before { content: ""; position: absolute; inset: -4px; }
.chat-h .icon-btn svg { width: 18px; height: 18px; }
.chat-log { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 14px;
  -webkit-user-select: text; user-select: text; overscroll-behavior: contain; overflow-x: hidden; }
.msg { max-width: 100%; font-size: 15px; line-height: 1.6; word-wrap: break-word; animation: msgIn .45s var(--ease-out) both; }
@keyframes msgIn { from { opacity: 0; filter: blur(6px); transform: translateY(6px); } }
.msg.user { align-self: flex-end; max-width: 86%; padding: 9px 14px; border-radius: 18px 18px 6px 18px; white-space: pre-wrap;
  background: linear-gradient(135deg, rgba(122,167,255,.32), rgba(180,140,255,.24)); box-shadow: inset 0 1px 0 var(--edge-hi), inset 0 0 0 1px var(--edge); }
.msg.bot { align-self: stretch; color: var(--text); }
.msg.bot p { margin: 0 0 .55em; } .msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul, .msg.bot ol { margin: .2em 0 .55em; padding-left: 1.3em; }
.msg.bot code { font: 13px ui-monospace, Menlo, monospace; background: var(--glass-hi); padding: 1px 5px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--edge); }
.msg.bot pre { margin: .4em 0; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.25); overflow-x: auto; }
.msg.bot pre code { background: none; box-shadow: none; padding: 0; }
.msg.bot .txt.live > :last-child::after { content: ""; display: inline-block; width: .5em; height: 1em; margin-left: 2px; vertical-align: -2px; border-radius: 2px;
  background: var(--accent); animation: caret 1s steps(2) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.msg .err { color: var(--err); font-size: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.msg .stopped { color: var(--text3); font-size: 12px; }
.shimmer { font-size: 14px; background: linear-gradient(90deg, var(--text3) 0%, var(--text3) 40%, var(--text) 50%, var(--text3) 60%, var(--text3) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.6s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 28px; padding: 3px 10px; border-radius: 14px; font-size: 12.5px; color: var(--text2);
  background: var(--glass-hi); box-shadow: inset 0 0 0 1px var(--edge); animation: msgIn .4s var(--ease-out) both; }
.chip svg { width: 14px; height: 14px; flex: none; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.mem { color: var(--text); background: linear-gradient(135deg, rgba(180,140,255,.22), rgba(122,167,255,.14)); }
.chip button { color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0 2px; position: relative; flex: none; }
.chip button::before { content: ""; position: absolute; inset: -10px -6px; }
.chat-empty { margin: auto 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 10px 0 20px; }
.chat-empty .orb { --s: 76px; margin-bottom: 6px; }
.chat-empty b { font-size: 19px; }
.chat-empty p { margin: 0; color: var(--text2); font-size: 14px; }
.sugs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.sugs button { min-height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13.5px; color: var(--text); background: var(--glass-hi); box-shadow: inset 0 0 0 1px var(--edge); }
.chat-caption { flex: none; margin: 0 16px; font-size: 15px; color: var(--text2); min-height: 0; max-height: 0; overflow: hidden; transition: max-height .3s var(--ease-out); }
.chat-caption.show { max-height: 6em; padding-bottom: 6px; }
.chat-in { flex: none; margin: 4px 10px 10px; display: flex; align-items: flex-end; gap: 6px; padding: 6px 6px 6px 14px; border-radius: 22px;
  background: var(--glass-hi); box-shadow: inset 0 0 0 1px var(--edge); transition: box-shadow .2s; }
.chat-in:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(122,167,255,.12); }
.chat-in textarea { flex: 1; resize: none; border: 0; outline: none; background: none; color: var(--text); font: 15px/1.45 -apple-system, system-ui, sans-serif;
  padding: 7px 0; max-height: 9.5em; min-height: 1.45em; -webkit-user-select: text; user-select: text; }
.chat-in textarea::placeholder { color: var(--text3); }
.send-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; background: var(--accent-fill, var(--accent)); position: relative;
  transition: transform .3s var(--spring), opacity .2s, background .2s; }
.send-btn::before { content: ""; position: absolute; inset: -4px; }
.send-btn svg { width: 18px; height: 18px; }
.send-btn[disabled] { opacity: .35; transform: scale(.9); cursor: default; }
.send-btn.stop { background: var(--text); color: var(--bg); }
.mic-btn { width: 36px; height: 36px; border-radius: 50%; display: none; place-items: center; flex: none; color: var(--text2); position: relative; }
.mic-btn svg { width: 18px; height: 18px; }
.chat.has-voice .mic-btn { display: grid; }
.mic-btn[aria-pressed="true"] { color: #fff; background: var(--err); }
/* 清理确认卡：Vesper 先列清单，你点「移到废纸篓」或口头同意才动；只进废纸篓，可撤销 */
.chips > .clean { flex: 1 1 100%; min-width: 0; }
.clean { margin: 2px 0 8px; padding: 12px 12px 10px; border-radius: 18px; background: var(--glass-hi); box-shadow: inset 0 1px 0 var(--edge-hi), inset 0 0 0 1px var(--edge); animation: msgIn .45s var(--ease-out) both; }
.clean-h { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
.clean-h b { font-size: 15px; } .clean-h .num { margin-left: auto; font-size: 17px; font-weight: 650; }
.clean-g { font-size: 11.5px; color: var(--text3); margin: 8px 4px 2px; letter-spacing: .3px; }
.clean-r { display: flex; align-items: flex-start; gap: 10px; padding: 7px 4px; border-radius: 10px; cursor: pointer; }
.clean-r input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 1px 0 0; flex: none; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--text3); display: grid; place-items: center; transition: background .15s, box-shadow .15s; }
.clean-r input:checked { background: var(--accent); box-shadow: none; }
.clean-r input:checked::after { content: ""; width: 10px; height: 6px; margin-top: -2px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg); }
.clean-r .t { flex: 1; min-width: 0; overflow: hidden; font-size: 13.5px; line-height: 1.4; }
.clean-r .t small { display: block; color: var(--text3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clean-r .num { font-size: 13px; color: var(--text2); white-space: nowrap; }
.clean-a { display: flex; gap: 8px; margin-top: 10px; }
.clean-a .btn { flex: 1; min-height: 40px; }
.clean-note { font-size: 12.5px; color: var(--text3); margin: 8px 4px 0; }
.clean.off .clean-r { pointer-events: none; opacity: .55; } .clean.off .clean-a { display: none; }
.mem-list { display: flex; flex-direction: column; gap: 8px; }
.mem-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 6px 10px 14px; border-radius: 14px; background: var(--glass-hi); box-shadow: inset 0 0 0 1px var(--edge); }
.mem-item p { margin: 0; flex: 1; font-size: 14.5px; line-height: 1.5; }
.mem-item small { display: block; color: var(--text3); font-size: 12px; margin-top: 2px; }
.mem-item .icon-btn { width: 36px; height: 36px; background: transparent; box-shadow: none; }
.mem-item .icon-btn svg { width: 16px; height: 16px; }
@media (max-width: 720px) {
  .chat { top: auto; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); width: auto; height: 78vh; transform: translateY(105%); }
  body.chat-open .sheet { left: 50%; width: min(680px, 100%); }
  .ask-pill > span:not(.orb), .ask-pill > kbd { display: none; } .ask-pill { padding: 0 12px; } .ask-pill .orb { margin-left: 0; }
}

/* Deck 窗口：红黄绿按钮直接浮在顶栏左边（透明标题栏 + 内容铺到标题栏下面），顶栏空白处可以拖动窗口 */
html.mac-titlebar header { padding-left: 88px; }
.voice-pick { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 44px; text-align: left; font-size: 15px; }
.voice-pick .radio { width: 20px; height: 20px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px var(--text3); transition: box-shadow .2s; }
.voice-pick[aria-pressed="true"] .radio { box-shadow: inset 0 0 0 6px var(--accent); }
.hero.dual { column-gap: 14px; }
.fu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fu-c { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 12px; background: var(--glass-hi); box-shadow: inset 0 0 0 1px var(--edge); min-width: 0; }
.fu-c small { font-size: 12px; color: var(--text3); } .fu-c b { font-size: 18px; } .fu-c span { font-size: 11.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) { .fu { grid-template-columns: repeat(2, 1fr); } }
.hero.dual b { font-size: 28px; letter-spacing: -.5px; }
.hero.dual b.plus { font-weight: 400; color: var(--text3); margin: 0 -4px; }
.steps { margin: 0; padding-left: 1.3em; font-size: 14px; line-height: 1.6; color: var(--text2); }
.cmd { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 10px 10px 12px; border-radius: 12px; background: rgba(0,0,0,.28); }
.cmd > .btn { align-self: flex-end; flex-shrink: 0; } /* 复制按钮放在命令下面右侧，不和命令文字抢位置（11-06 自查：并排时会压到文字） */
.cmd code { flex: 1; min-width: 0; max-height: 7.5em; overflow: auto; color: #e6edf7; }
.hero.dual small { flex-basis: 100%; }
.hero i.approx { font-style: normal; font-size: 13px; font-weight: 600; color: var(--text3); margin-right: 3px; letter-spacing: 0; vertical-align: 4px; }

/* ================= 视觉齐平（要求）=================
   统一尺度：间距走 4 的倍数（4/8/12/16）；顶栏所有控件同高 44、全胶囊/正圆；卡片内按钮 32 高胶囊；
   内层面板圆角 14、卡片 20；文字层级：卡片标题 15/600、主数字 32、正文 13.5、说明 12。 */
:root { --r: 20px; --ctl: 44px; }
header { gap: 10px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
header .pill, header .icon-btn, header .tabs, header .ask-pill, header .btn { height: var(--ctl); min-height: var(--ctl); border-radius: calc(var(--ctl) / 2); }
header .icon-btn, .sheet-h .icon-btn { width: var(--ctl); }
.sheet-h .icon-btn { height: var(--ctl); border-radius: calc(var(--ctl) / 2); }
.sheet-h .btn.sm { min-height: 36px; border-radius: 18px; }
header .pill { padding: 0 16px; font-size: 14px; }
header .btn { padding: 0 18px; font-size: 14px; }
/* 监控台 / 管家：和「Vesper」一样的胶囊，滑块也是胶囊 */
.seg.tabs { padding: 4px; gap: 0; align-items: stretch; }
.seg.tabs button { flex: 0 0 auto; white-space: nowrap; min-height: 0; padding: 0 20px; border-radius: 18px; font-size: 15px; font-weight: 500; }
.seg.tabs button[aria-pressed="true"] { font-weight: 600; }
.seg.tabs .thumb { top: 4px; bottom: 4px; border-radius: 18px; }
/* 卡片 */
.card { padding: 16px; container-type: inline-size; }
.card-h { height: 28px; gap: 8px; }
.card-b { gap: 12px; padding-top: 12px; }
.state { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; line-height: 1; }
.hero { gap: 4px 8px; }
.hero b { font-size: 32px; }
.hero small, .sub, .kv, .note { font-size: 13px; }
.sec { font-size: 12px; margin-top: 0; }
.li { min-height: 30px; font-size: 13.5px; }
.btn { border-radius: 22px; }
.btn.sm { min-height: 32px; padding: 0 14px; border-radius: 16px; }
.bars { height: 36px; gap: 3px; }
.bars i { border-radius: 3px 3px 1px 1px; }
/* 两种货币并排时按卡片宽度自动缩小，不折行 */
.hero.dual b { font-size: clamp(20px, 10.5cqi, 30px); }
.hero.dual b.plus { font-size: clamp(16px, 7cqi, 22px); }
.group, .sheet .tile { border-radius: 14px; }
/* 「几项需要注意」下拉 & 卡片徽章说明 */
#overall { cursor: pointer; font: inherit; border: 0; }
#overall[aria-expanded="true"] { box-shadow: var(--shadow), inset 0 0 0 1px var(--edge-hi); }
.state[data-act="why"] { cursor: pointer; }
@media (hover: hover) { .state[data-act="why"]:hover { filter: brightness(1.08); box-shadow: inset 0 0 0 1px currentColor; } }
#whyPop { position: fixed; z-index: 60; overflow: auto; padding: 8px; border-radius: 20px; display: flex; flex-direction: column; gap: 6px;
  background: var(--glass, var(--card)); -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
  box-shadow: 0 18px 50px -12px rgba(0,0,0,.35), inset 0 0 0 1px var(--edge);
  opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right; transition: opacity .18s ease, transform .22s cubic-bezier(.2,.8,.2,1); }
#whyPop.show { opacity: 1; transform: none; }
/* 关着时必须彻底不可点：#whyPop 的 display:flex 会盖过 [hidden]，透明的条目曾经挡在「立即刷新 / ✕」上面，点了就跳去别的卡（11-05 bug） */
#whyPop[hidden] { display: none !important; }
#whyPop:not(.show) { pointer-events: none; }
.why-g { display: block; width: 100%; text-align: left; font: inherit; color: inherit; border: 0; background: transparent; padding: 10px 12px; border-radius: 14px; cursor: pointer; }
.why-g:hover, .why-g:focus-visible { background: var(--track); }
.why-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; } .why-h b { flex: 1; font-size: 14.5px; } .why-h .ic { width: 20px; height: 20px; }
.why-i { display: flex; gap: 10px; align-items: flex-start; padding: 3px 0 3px 2px; } .why-i .dot { margin-top: 7px; }
.why-i p { margin: 0; font-size: 14px; color: var(--text); line-height: 1.4; } .why-i small { font-size: 12.5px; color: var(--text2); }
.why-empty { display: flex; gap: 8px; align-items: center; padding: 12px; color: var(--text2); font-size: 14px; } .why-empty .ic { width: 18px; height: 18px; color: var(--ok); }
/* 弹层里的分段控件和顶栏一样用胶囊形（视觉齐平） */
.sheet .seg { border-radius: 22px; padding: 3px; } .sheet .seg button { border-radius: 19px; }
/* 动手确认卡 */
.hands .clean-h { align-items: center; } .hands .clean-h svg { width: 18px; height: 18px; color: var(--accent); }
.hands-b { display: flex; flex-direction: column; gap: 4px; margin: 0 2px 8px; font-size: 14px; }
.hands-b div { display: flex; gap: 10px; } .hands-b small { width: 2.6em; flex: none; color: var(--text3); font-size: 12.5px; padding-top: 1px; }
.hands-b span { min-width: 0; word-break: break-all; }
.chat.acting .lg-shine { box-shadow: inset 0 1.5px 0 var(--lg-rim), inset 0 0 0 1.5px var(--accent), inset 0 0 30px -8px var(--accent); }
/* 联网来源 */
.srcs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 6px; animation: msgIn .4s var(--ease-out) both; }
.srcs-q { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); margin-right: 2px; max-width: 100%; }
.srcs-q svg { width: 13px; height: 13px; flex: none; } .srcs-q span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 3px; border-radius: 12px; font-size: 12px; color: var(--text2); text-decoration: none;
  background: var(--glass-hi); box-shadow: inset 0 0 0 1px var(--edge); max-width: 160px; }
.src:hover { color: var(--text); box-shadow: inset 0 0 0 1px var(--edge-hi); }
.src i { font-style: normal; font-size: 10.5px; font-weight: 650; width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; background: var(--track); color: var(--text2); flex: none; }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 进程详情卡 */
.pseg { margin-bottom: 2px; }
.pai { padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(180,140,255,.14), rgba(122,167,255,.10)); box-shadow: inset 0 0 0 1px var(--edge); display: flex; flex-direction: column; gap: 6px; }
.pai-h { display: flex; align-items: center; gap: 8px; } .pai-h b { flex: 1; font-size: 14px; } .pai-h .orb { width: 20px; height: 20px; }
.plist { display: flex; flex-direction: column; }
.prow { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow.flag { background: linear-gradient(90deg, rgba(245,181,70,.08), transparent 70%); border-radius: 10px; }
.pmain { flex: 1; min-width: 0; }
.pn { display: flex; align-items: baseline; gap: 8px; font-size: 14.5px; }
.pn .t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pn .pv { margin-left: auto; font-size: 14.5px; font-weight: 650; white-space: nowrap; }
.ps { font-size: 12px; color: var(--text3); margin-top: 1px; }
.pr { font-size: 12.5px; color: var(--text2); margin-top: 3px; }
.ptag { font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 8px; white-space: nowrap; background: var(--track); color: var(--text2); }
.ptag.meh { background: rgba(245,181,70,.16); color: var(--warn); } .ptag.bad { background: rgba(255,107,107,.16); color: var(--err); }
.pbtn { display: flex; gap: 6px; flex: none; align-items: center; }
.btn.danger { color: var(--err); } .btn.danger.armed { background: var(--err); color: #fff; }
.plock { font-size: 12px; }
/* DeepSeek 卡：金额占满一行，「查余额」放在下面说明文字的右边 */
.ds-top { position: relative; flex: none; }
.ds-top > .btn { position: absolute; right: 0; bottom: 0; }
/* 「查余额」只占最后一行（余额时间 / 提示那行）的右端，那一行至少和按钮一样高，所以永远压不到金额 */
.ds-top > .hero:nth-last-child(2) > small:last-child, .ds-top > .sub:nth-last-child(2) { min-height: 32px; display: flex; align-items: center; padding-right: 84px; box-sizing: border-box; }
.row-btn { border-radius: 14px; }
/* ===== Vesper 液态玻璃面板（：60–70% 透明，像一块玻璃弹出来，不重复名字） =====
   思路照苹果 Liquid Glass：底子很薄（约 30% 着色）、模糊很轻，边缘一圈更强的折射/提亮，顶部高光。
   WKWebView 里拿不到 NSGlassEffectView 的真折射，用 backdrop-filter 两层叠出来。 */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:root { --lg-a: .4; --lg-a2: .3; --lg-tint: rgba(255,255,255,var(--lg-a)); --lg-tint2: rgba(255,255,255,var(--lg-a2)); --lg-rim: rgba(255,255,255,.75); --lg-rim2: rgba(255,255,255,.28); --lg-ink-halo: rgba(255,255,255,.55);
  /* 对话气泡：玻璃透得多，气泡要实一点、软一点（像云），字才看得清 */
  --bub-bot: rgba(255,255,255,.94); --bub-user: linear-gradient(135deg, #dfe8ff, #ebe2ff); --bub-ink: #1d2230;
  --bub-shadow: 0 8px 22px -10px rgba(40,56,100,.35), 0 2px 6px -2px rgba(40,56,100,.12); --bub-rim: rgba(255,255,255,.9); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lg-tint: rgba(28,32,46,var(--lg-a)); --lg-tint2: rgba(28,32,46,var(--lg-a2)); --lg-rim: rgba(255,255,255,.34); --lg-rim2: rgba(255,255,255,.10); --lg-ink-halo: rgba(0,0,0,.45);
  --bub-bot: rgba(40,44,58,.94); --bub-user: linear-gradient(135deg, #34446e, #43386e); --bub-ink: #eef1f8;
  --bub-shadow: 0 8px 22px -10px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.3); --bub-rim: rgba(255,255,255,.10); } }

  <button class="icon-btn" id="refreshAll" data-press aria-label="全部刷新"></button>

    var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.uRes, w, h); gl.uniform1f(U.uT, flow); gl.uniform1f(U.uL, lvl); gl.uniform1f(U.uDpr, dpr); gl.uniform1f(U.uLight, isLight() ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (!reduced) raf = requestAnimationFrame(draw);
  }
  // 减少动画时不循环：只在有变化时补画一帧
  function kick() { if (canvas && !raf && !canvas.hasAttribute("data-fallback")) { last = performance.now(); raf = requestAnimationFrame(draw); } }

  function teardown() {
    if (!canvas) return;
    cancelAnimationFrame(raf); raf = 0;
    window.removeEventListener("resize", kick);
    if (mo) mo.disconnect();
    if (mq) (mq.removeEventListener ? mq.removeEventListener("change", kick) : mq.removeListener(kick));
    if (mqL) (mqL.removeEventListener ? mqL.removeEventListener("change", kick) : mqL.removeListener(kick));
    canvas.removeEventListener("webglcontextlost", onLost);
    if (gl) { if (prog) gl.deleteProgram(prog); if (buf) gl.deleteBuffer(buf); }
    canvas.remove(); canvas = gl = prog = buf = mo = mq = mqL = null;
  }

  window.DeckGlow = {
    show: function (o) { if (document.documentElement.classList.contains("notch")) return; this.set(o || {}); if (!canvas) setup(); }, // 刘海模式不铺全屏边缘光
    set: function (o) { if (o.level != null) live.level = Math.max(0, Math.min(1, o.level)); if (o.thinking != null) live.thinking = !!o.thinking; kick(); },
    hide: function () { live.level = 0; live.thinking = false; teardown(); },
    get on() { return !!canvas; }
  };
})();
